<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ API Console</title>
  <link rel="stylesheet" href="2.css"/>

<body>
<div class="container">
  <h1 class="page-title">⚡ API CONSOLE</h1>

  <div class="card card-get">
    <h1>📡 GET</h1>
    <p id="Get"></p>
    <div id="results"></div>
    <div class="form-row" style="margin-top:12px">
      <button class="btn-get" onclick="Get()">GET</button>
    </div>
  </div>

  <div class="card card-post">
    <h1>📤 POST</h1>
    <p id="Post"></p>
    <div class="form-row">
      <input type="number" id="X" placeholder="X"/>
      <input type="number" id="Y" placeholder="Y"/>
      <select id="Op">
        <option>add</option><option>sub</option><option>mul</option><option>div</option>
      </select>
      <button class="btn-post" onclick="Post()">POST</button>
    </div>
  </div>

  <div class="card card-put">
    <h1>✏️ PUT</h1>
    <p id="Put"></p>
    <div class="form-row">
      <input type="number" id="PutX" placeholder="X"/>
      <input type="number" id="PutY" placeholder="Y"/>
      <select id="PutOp">
        <option>add</option><option>sub</option><option>mul</option><option>div</option>
      </select>
      <button class="btn-put" onclick="Put()">PUT</button>
    </div>
  </div>

  <div class="card card-delete">
    <h1>💥 DELETE</h1>
    <p id="Delete"></p>
    <div class="form-row">
      <button class="btn-delete" onclick="Delete()">DELETE</button>
    </div>
  </div>
</div>
